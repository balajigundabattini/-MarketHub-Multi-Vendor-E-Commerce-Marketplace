markethub.security.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
markethub.security.jwt.issuer=markethub-test
markethub.security.jwt.access-token-minutes=15
markethub.security.refresh-token-days=7
markethub.security.refresh-cookie-secure=false
markethub.security.frontend-origin=http://localhost:5173

# Test Database
spring.datasource.url=jdbc:mysql://localhost:3306/markethub_test
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:code}
spring.flyway.enabled=true

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC