spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}
markethub.security.jwt.secret-base64=${JWT_SECRET_BASE64}
markethub.security.jwt.issuer=${JWT_ISSUER:markethub}
markethub.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
markethub.security.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
markethub.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
markethub.security.frontend-origin=${FRONTEND_ORIGIN}
markethub.mail.from=${MAIL_FROM:noreply@markethub.local}
markethub.payments.razorpay.key-id=${RAZORPAY_KEY_ID}
markethub.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
markethub.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
markethub.payments.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
markethub.checkout.reservation-sweep-ms=${CHECKOUT_RESERVATION_SWEEP_MS:60000}
markethub.seller.commission-rate=${SELLER_COMMISSION_RATE:0.10}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false
logging.level.org.springframework.security=INFO
